<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- the console is not listed by the search engines -->
	<meta name="robots" content="noindex, nofollow">
	<title>Data administration</title>

	<!-- style sheets: common theme and accessibility panel, then the styles of the console -->
	<link rel="stylesheet" type="text/css" href="/css/theme.css">
	<link rel="stylesheet" type="text/css" href="/css/accessibility.css">
	<link rel="stylesheet" type="text/css" href="admin.css">

	<!-- d3 and the accessibility panel shared by all the pages -->
	<script type='text/javascript' src='/lib/d3.min.js'></script>
	<script type='text/javascript' src='/js/accessibility.js'></script>
</head>

<body>
    <main class="page">
        <header class="page-header">
            <a class="back-link" href="/">← All the visualizations</a>
            <h1>Data administration</h1>
            <p>Add data to the datasets used by the visualizations. The original files are never modified:
                an added file can always be removed.</p>
        </header>

        <!-- one card per dataset, see admin.js -->
        <div id="datasets"><p id="loading" class="hint">Loading the datasets…</p></div>
    </main>

    <script type='text/javascript' src='admin.js'></script>
</body>
</html>
