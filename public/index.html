<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fires in Oregon — visualizations</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/accessibility.css">
    <link rel="stylesheet" href="index.css">
</head>
<body class="index-body">
    <main class="page">
        <header class="page-header">
            <h1>Fires in Oregon (2000-2022)</h1>
            <p>Visualizations of the <a href="https://www.kaggle.com/datasets/mattop/fire-occurrence-and-cause-data-2000-2022">Fire Occurrence and Cause Data</a> dataset.</p>
        </header>

        <div class="home-grid">
            <!-- Main area (3fr, spans the 3 rows): empty for now -->
            <section class="home-main card" aria-label="Main area"></section>

            <!-- One cell per visualization: a live miniature (iframe) and a link covering the whole cell.
                 Each page is in its own folder of public/ -->
            <div class="viz-card card">
                <iframe src="/heatmap/" title="" tabindex="-1" aria-hidden="true"></iframe>
                <a class="viz-link" href="/heatmap/">
                    <span class="viz-title">Heatmap counties × months</span>
                </a>
            </div>

            <div class="viz-card card">
                <iframe src="/sunburst/" title="" tabindex="-1" aria-hidden="true"></iframe>
                <a class="viz-link" href="/sunburst/">
                    <span class="viz-title">Sunburst of the causes</span>
                </a>
            </div>

            <div class="viz-card card">
                <iframe src="/bulletgraph/" title="" tabindex="-1" aria-hidden="true"></iframe>
                <a class="viz-link" href="/bulletgraph/">
                    <span class="viz-title">Bullet Graph</span>
                </a>
            </div>
        </div>
    </main>

    <script src="/js/accessibility.js"></script>
    <script>FireAccessibility.init()</script>
    <script src="index.js"></script>
</body>
</html>
