<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Fire visualisation - Bullet Graph</title>
</head>
<body>
    <h1>Fire visualisation - Bullet Graph</h1>
    <div id="bullet"></div>

    <!-- order matters: d3 first, then fireData.js, then fireStats.js -->
    <script src="/lib/d3.min.js"></script>
    <script src="../js/fireData.js"></script>
    <script src="fireDataBulletGraph.js"></script>
    <script src="fireBulletGraph.js"></script>

    <script>
        loadFireStats().then(({ fires, yearlyStats, causePerYear, causePerYearWide }) => {
            // check the results in the browser console (F12)
            console.table(yearlyStats)
            console.table(causePerYear)
            console.log('wide format', causePerYearWide)
            
            createFireBulletGraph('#bullet', { fires, yearlyStats, causePerYearWide }, {
                referenceStat: 'median',   // or 'mean'
                year: 2000                 // optional, default = latest year
            })
        })
    </script>
</body>
</html>
