<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incendies de l'Oregon</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <h1>Incendies de l'Oregon</h1>
        <p>Immobilisez le curseur pour explorer avec le fisheye. Patientez encore une seconde pour ouvrir une vue rapprochée.</p>
      </header>

      <section class="controls" aria-label="Filtres de la carte">
        <p id="year-instruction">Choisir une année : cliquer ou faire glisser le curseur. Utiliser les flèches gauche et droite au clavier.</p>
        <svg id="year-ruler" role="slider" tabindex="0" aria-label="Choisir l'année" aria-describedby="year-instruction"></svg>
      </section>

      <section class="visualisation" aria-label="Carte interactive">
        <div class="map-toolbar">
          <button id="fisheye-toggle" type="button" aria-pressed="true" aria-controls="map" disabled>Désactiver le fisheye</button>
          <button id="return-overview" type="button" aria-controls="map" hidden>Revenir à la carte</button>
          <span id="fisheye-state" role="status">Fisheye activé</span>
        </div>
        <svg id="map" role="img" aria-label="Carte des incendies de l'Oregon"></svg>
        <p id="status" class="status" aria-live="polite">Chargement de la carte…</p>
      </section>

      <aside id="tooltip" class="tooltip" aria-live="polite" hidden></aside>
    </main>

    <script src="/lib/d3.min.js"></script>
    <script src="js/fireData.js"></script>
    <script src="js/fisheye-controller.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
