<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fires in Oregon — visualizations</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/accessibility.css">
    <link rel="stylesheet" href="index.css">
</head>
<body class="index-body">
    <main class="page">
        <header class="page-header">
            <h1>Fires in Oregon (2000-2022)</h1>
            <p>Visualizations of the <a href="https://www.kaggle.com/datasets/mattop/fire-occurrence-and-cause-data-2000-2022">Fire Occurrence and Cause Data</a> dataset.</p>
        </header>
        <!-- after </header>, before <div class="home-grid"> -->
        <section class="year-ruler card" aria-label="Year of the visualizations">
            <div id="yearRuler"></div>
        </section>

        <div class="home-grid">
            <!-- Main area (3fr, spans the 3 rows): empty for now -->
            <section class="home-main card" aria-label="Main area"></section>

            <div class="viz-card card" data-interactive>
                <iframe src="/heatmap/?embed" data-target="#heatmap" data-sync-year title="" tabindex="-1" aria-hidden="true"></iframe>
                <button type="button" class="viz-link" data-href="/heatmap/">
                    <span class="viz-title">Heatmap counties × months</span>
                </button>
            </div>

            <div class="viz-card card">
                <iframe src="/sunburst/?embed" data-target="#sunburst" title="" tabindex="-1" aria-hidden="true"></iframe>
                <button type="button" class="viz-link" data-href="/sunburst/">
                    <span class="viz-title">Sunburst of the causes</span>
                </button>
            </div>

            <div class="viz-card card" data-interactive>
                <iframe src="/bulletgraph/?embed" data-target="#bullet" data-sync-year title="" tabindex="-1" aria-hidden="true"></iframe>
                <button type="button" class="viz-link" data-href="/bulletgraph/">
                    <span class="viz-title">Bullet Graph</span>
                </button>
            </div>

            <div class="viz-card card" data-main data-interactive>
                <iframe src="/bubblemap/?embed" data-target="#map" data-sync-year title="" tabindex="-1" aria-hidden="true"></iframe>
                <button type="button" class="viz-link" data-href="/bubblemap/">
                    <span class="viz-title">Wildfire bubble map</span>
                </button>
            </div>
        </div>
    </main>

    <script src="/lib/d3.min.js"></script>
    <script src="/js/accessibility.js"></script>
    <script>FireAccessibility.init()</script>
    <script src="/js/yearRuler.js"></script>
    <script src="index.js"></script>
</body>
</html>
